<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#102f39"><title>استوديو عروض السفر</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700;800&display=swap');
:root{--navy:#102f39;--teal:#14616a;--gold:#c8a96b;--bg:#eef3f4;--card:#fff;--ink:#18343b;--muted:#70858a;--line:#dce6e8;--soft:#f5f8f8;--radius:19px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Tajawal,Arial,sans-serif}
header{background:linear-gradient(115deg,#0e2c36,#174c54);color:white;padding:22px max(22px,calc((100vw - 1450px)/2));display:flex;align-items:center;justify-content:space-between;gap:20px;box-shadow:0 8px 26px #102f3922}
.brand{display:flex;align-items:center;gap:14px}.logo{width:48px;height:48px;border-radius:15px;background:#ffffff17;display:grid;place-items:center;font-size:25px;border:1px solid #ffffff25}.brand h1{margin:0;font-size:23px;font-weight:800}.brand p{margin:3px 0 0;color:#c1d4d4;font-size:13px}
.header-right{display:flex;gap:10px;align-items:center}.status{font-size:12px;color:#e9d6a9;border:1px solid #ffffff2b;border-radius:30px;padding:8px 13px}
.app{max-width:1450px;margin:26px auto;padding:0 20px;display:grid;grid-template-columns:220px minmax(0,1fr);gap:20px}
.sidebar,.panel,.preview-card,.saved-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 5px 20px #193a4410}
.sidebar{padding:17px;height:max-content;position:sticky;top:18px}.side-label{font-size:11px;color:#91a2a5;font-weight:800;padding:8px 10px 12px}.nav{display:flex;flex-direction:column;gap:5px}.nav button{border:0;background:transparent;text-align:right;padding:12px 11px;border-radius:12px;color:#51686d;font:600 14px Tajawal;cursor:pointer;display:flex;align-items:center;gap:10px}.nav button.active{background:#e8f1f1;color:var(--teal);font-weight:800}.nav button:hover{background:#f2f6f6}.nav .ico{font-size:18px;width:25px;text-align:center}
.main{min-width:0}.welcome{display:flex;justify-content:space-between;align-items:end;margin:0 0 18px;gap:15px}.welcome h2{font-size:22px;margin:0 0 4px}.welcome p{margin:0;color:var(--muted);font-size:13px}.work{display:grid;grid-template-columns:minmax(0,1fr) minmax(360px,.95fr);gap:18px;align-items:start}
.panel{padding:21px}.panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.panel h3{font-size:17px;margin:0}.sub{font-size:12px;color:var(--muted)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.field{display:flex;flex-direction:column;gap:6px;min-width:0}.field.full{grid-column:1/-1}label{font-size:12px;color:#60777c;font-weight:700}input,select,textarea{width:100%;border:1px solid var(--line);background:#fbfdfd;border-radius:11px;padding:11px 12px;font:500 14px Tajawal;color:var(--ink);outline:none;min-width:0}input:focus,select:focus,textarea:focus{border-color:#6c9da0;box-shadow:0 0 0 3px #14616a12}textarea{min-height:75px;resize:vertical}
fieldset{border:1px solid var(--line);border-radius:14px;padding:14px;margin:0 0 13px;min-width:0}legend{font-size:13px;font-weight:800;color:var(--teal);padding:0 7px}
.row-list{display:flex;flex-direction:column;gap:8px}.repeat-row{display:grid;grid-template-columns:85px minmax(0,1fr) auto;gap:8px;align-items:center}.repeat-row input{padding:9px}.small-btn{border:1px solid var(--line);background:#f5f8f8;color:#526a6e;border-radius:9px;padding:8px 11px;font:600 12px Tajawal;cursor:pointer}.add{margin-top:9px;border:1px dashed #9bb8ba;background:#f2f8f8;color:var(--teal);border-radius:10px;padding:9px 13px;font:700 12px Tajawal;cursor:pointer}
.preview-card{padding:21px;position:sticky;top:18px}.preview-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:15px}.preview-top h3{margin:0;font-size:17px}.actions{display:flex;flex-wrap:wrap;gap:7px}.btn{border:0;border-radius:10px;padding:10px 13px;font:700 12px Tajawal;cursor:pointer}.primary{background:var(--teal);color:white}.secondary{background:#e8f0f0;color:#244e53}.outline{background:white;color:var(--teal);border:1px solid #8eafb1}.gold{background:#f3ead8;color:#725b30}
.offer{background:#f4f8f8;border:1px solid #e5eded;border-radius:15px;padding:24px;min-height:400px;white-space:pre-wrap;line-height:2.1;font-size:15px;color:#1c363d;overflow-wrap:anywhere}.offer:empty:before{content:'سيظهر العرض هنا بمجرد إدخال البيانات...';color:#9aaeb1}
.saved-card{padding:18px;margin-top:18px}.saved-head{display:flex;justify-content:space-between;align-items:center}.saved-head h3{margin:0;font-size:16px}.saved-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:9px;margin-top:12px}.saved-item{border:1px solid var(--line);border-radius:11px;padding:11px;display:flex;justify-content:space-between;gap:8px;align-items:center}.saved-item strong{font-size:12px;display:block}.saved-item small{color:var(--muted);font-size:11px}.saved-item button{border:0;background:transparent;color:var(--teal);cursor:pointer;font:700 12px Tajawal}
.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,20px);opacity:0;background:#123d43;color:white;padding:12px 20px;border-radius:12px;transition:.2s;z-index:10;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}
.hidden{display:none!important}.empty{color:#91a2a5;font-size:13px;margin:15px 0 2px}
@media(max-width:1050px){.work{grid-template-columns:1fr}.preview-card{position:static}.app{grid-template-columns:180px minmax(0,1fr)}}
@media(max-width:700px){header{padding:16px}.brand h1{font-size:18px}.status{display:none}.app{display:block;margin:15px auto;padding:0 12px}.sidebar{position:static;margin-bottom:14px;padding:10px;overflow:auto}.side-label{display:none}.nav{flex-direction:row;width:max-content}.nav button{white-space:nowrap;padding:9px}.nav .ico{width:auto}.welcome{margin:0 2px 13px}.welcome h2{font-size:19px}.panel,.preview-card{padding:15px}.form-grid{grid-template-columns:1fr 1fr}.offer{padding:17px;font-size:14px;min-height:250px}.preview-top{align-items:flex-start;flex-direction:column}.actions{width:100%}.actions .btn{flex:1}}
@media print{body{background:white}.app,header,.sidebar,.welcome,.panel,.saved-card,.preview-top,.actions{display:none!important}.preview-card{display:block!important;position:static;border:0;box-shadow:none;padding:0}.offer{border:0;background:white;padding:0;min-height:0;font-size:14pt;line-height:1.9}}
</style></head>
<body>
<header><div class="brand"><div class="logo">✦</div><div><h1>استوديو عروض السفر</h1><p>كل عروضك السياحية في مكان واحد</p></div></div><div class="header-right"><span class="status">مساحة عمل شخصية</span></div></header>
<div class="app">
<aside class="sidebar"><div class="side-label">الأقسام الرئيسية</div><nav class="nav" id="nav">
<button class="active" data-type="hotel"><span class="ico">🏨</span> الفنادق</button><button data-type="flight"><span class="ico">✈️</span> الطيران</button><button data-type="combined"><span class="ico">🧳</span> الطيران + الفندق</button><button data-type="cruise"><span class="ico">🚢</span> الكروز</button><button data-type="train"><span class="ico">🚆</span> القطارات</button><button data-type="transfer"><span class="ico">🚘</span> الانتقالات والسيارات</button><button data-type="ticket"><span class="ico">🎟️</span> التذاكر والفعاليات</button><button data-type="package"><span class="ico">🌍</span> الباقات السياحية</button><button data-type="saved"><span class="ico">📁</span> العروض المحفوظة</button>
</nav></aside>
<main class="main"><div class="welcome"><div><h2 id="pageTitle">عروض الفنادق</h2><p id="pageDesc">جهّز عرضك وعاينه وانسخه بالقالب المعتمد.</p></div><button class="btn outline" id="newBtn">＋ عرض جديد</button></div>
<div class="work" id="work"><section class="panel"><div class="panel-head"><h3>بيانات العرض</h3><span class="sub">املأ الحقول وسيظهر العرض مباشرة</span></div><div id="formArea"></div></section>
<section class="preview-card"><div class="preview-top"><h3>معاينة العرض</h3><div class="actions"><button class="btn primary" id="copyBtn">نسخ العرض</button><button class="btn secondary" id="printBtn">طباعة / PDF</button><button class="btn gold" id="saveBtn">حفظ العرض</button></div></div><div class="offer" id="offer"></div></section></div>
<section class="saved-card hidden" id="savedPage"><div class="saved-head"><h3>العروض المحفوظة على هذا الجهاز</h3><button class="small-btn" id="clearSaved">مسح الكل</button></div><div class="saved-list" id="savedList"></div></section>
</main></div><div class="toast" id="toast"></div>
<script>
const types={
hotel:{title:'عروض الفنادق',desc:'قالب الفندق المعتمد مع تفاصيل الغرف والإقامة.',fields:[['flag','علم الدولة','text'],['hotel','اسم الفندق','text'],['rooms','الغرف','rooms'],['in','تاريخ الدخول','date'],['out','تاريخ الخروج','date'],['meal','الوجبات','meal'],['guests','عدد الأفراد','text'],['price','السعر الإجمالي','text'],['currency','العملة','currency'],['notes','الملاحظات','notes']]},
flight:{title:'عروض الطيران',desc:'تفاصيل الرحلات والناقل والحقائب والركاب.',fields:[['airline','شركة الطيران','text'],['trip','نوع الرحلة','trip'],['legs','تفاصيل الرحلات','legs'],['adults','عدد البالغين','number'],['children','عدد الأطفال','number'],['infants','عدد الرضع','number'],['baggage','الحقائب','text'],['price','السعر الإجمالي','text'],['currency','العملة','currency']]},
combined:{title:'عروض الطيران + الفندق',desc:'الطيران أولاً ثم الفندق والسعر مرة واحدة في النهاية.',fields:[['airline','شركة الطيران','text'],['legs','تفاصيل الرحلات','legs'],['hotel','اسم الفندق','text'],['rooms','الغرف','rooms'],['in','تاريخ الدخول','date'],['out','تاريخ الخروج','date'],['meal','الوجبات','meal'],['guests','عدد الأفراد','text'],['price','السعر الإجمالي','text'],['currency','العملة','currency']]},
cruise:{title:'عروض الكروز',desc:'السفينة والكبينة والليالي وتفاصيل الركاب.',fields:[['line','خط الكروز','text'],['ship','السفينة','text'],['in','تاريخ الدخول','date'],['out','تاريخ الخروج','date'],['nights','عدد الليالي','number'],['cabin','الكبينة','text'],['guests','عدد الأفراد','text'],['price','السعر الإجمالي','text'],['currency','العملة','currency'],['notes','الملاحظات','notes']]},
train:{title:'عروض القطارات',desc:'بيانات الذهاب والعودة أو عدة مقاطع.',fields:[['operator','شركة القطار','text'],['legs','تفاصيل الرحلات','legs'],['guests','عدد الأفراد','text'],['baggage','الحقائب','text'],['price','السعر الإجمالي','text'],['currency','العملة','currency']]},
transfer:{title:'الانتقالات والسيارات',desc:'السيارات والسائقون والمسارات وتفاصيل الخدمة.',fields:[['vehicle','نوع السيارة','text'],['driver','السائق','text'],['date','التاريخ','date'],['route','خط السير / الاستقبال والتوصيل','text'],['guests','عدد الأفراد','text'],['luggage','الحقائب','text'],['duration','المدة / عدد الأيام','text'],['price','السعر','text'],['currency','العملة','currency']]},
ticket:{title:'التذاكر والفعاليات',desc:'الفعالية والتاريخ والفئة والكمية.',fields:[['event','اسم الفعالية / المباراة','text'],['date','التاريخ','date'],['time','الوقت','text'],['venue','المكان','text'],['category','فئة التذكرة / المقعد','text'],['quantity','العدد','number'],['price','السعر الإجمالي','text'],['currency','العملة','currency']]},
package:{title:'الباقات السياحية',desc:'برنامج الرحلة والإقامة والتنقلات والخدمات.',fields:[['destination','الوجهة / اسم الباقة','text'],['in','تاريخ البداية','date'],['out','تاريخ النهاية','date'],['guests','عدد الأفراد','text'],['meal','الوجبات','meal'],['details','تفاصيل البرنامج والخدمات','textarea'],['included','يشمل','textarea'],['excluded','لا يشمل','textarea'],['price','السعر الإجمالي','text'],['currency','العملة','currency'],['notes','الملاحظات','notes']]}
};
const labels={flag:'علم الدولة',hotel:'الفندق',in:'الدخول',out:'الخروج',meal:'الوجبات',guests:'عدد الأفراد',price:'السعر الإجمالي',currency:'العملة',airline:'شركة الطيران',trip:'نوع الرحلة',adults:'البالغون',children:'الأطفال',infants:'الرضع',baggage:'الحقائب',line:'خط الكروز',ship:'السفينة',nights:'عدد الليالي',cabin:'الكبينة',operator:'شركة القطار',vehicle:'نوع السيارة',driver:'السائق',date:'التاريخ',route:'خط السير',luggage:'الحقائب',duration:'المدة',event:'الفعالية',time:'الوقت',venue:'المكان',category:'الفئة',quantity:'العدد',destination:'الوجهة',details:'تفاصيل البرنامج',included:'يشمل',excluded:'لا يشمل',notes:'ملاحظة'};
const defaults={meal:'',currency:'دينار كويتي',trip:'ذهاب وعودة',rooms:[{count:1,name:''}],legs:[{from:'',to:'',date:'',depart:'',arrive:'',airline:''}],notes:['✅ السعر شامل جميع الضرائب ما عدا ضريبة المدينة (إن وجدت).','⚠️ السعر والإمكانية غير ثابتين حتى يتم تأكيد وإتمام الحجز.','❌ الحجز غير مسترد وغير قابل للتعديل.']};
let current='hotel',drafts={},data={},saved=JSON.parse(localStorage.getItem('travelOffersSaved')||'[]');
function fresh(t){let d={...defaults};types[t].fields.forEach(([k])=>{if(k==='rooms'||k==='legs'||k==='notes')d[k]=JSON.parse(JSON.stringify(defaults[k]));else if(k==='currency')d[k]=defaults.currency;else if(k==='trip')d[k]=defaults.trip;else d[k]=''});return d}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function field(k,label,type){let val=data[k]??'';if(type==='rooms'||type==='legs'||type==='notes')return repeatField(k,label);if(type==='meal')return '<div class="field"><label>'+label+'</label><select data-k="'+k+'"><option value="">—</option>'+['بدون وجبات','شامل الإفطار','نصف إقامة','إقامة كاملة','شامل جميع الوجبات','شامل كلياً'].map(x=>'<option '+(val===x?'selected':'')+'>'+x+'</option>').join('')+'</select></div>';if(type==='currency')return '<div class="field"><label>'+label+'</label><select data-k="'+k+'">'+['دينار كويتي','دولار أمريكي','يورو','جنيه مصري','ريال سعودي','درهم إماراتي','جنيه إسترليني'].map(x=>'<option '+(val===x?'selected':'')+'>'+x+'</option>').join('')+'</select></div>';if(type==='trip')return '<div class="field"><label>'+label+'</label><select data-k="'+k+'">'+['ذهاب فقط','ذهاب وعودة','عدة وجهات'].map(x=>'<option '+(val===x?'selected':'')+'>'+x+'</option>').join('')+'</select></div>';if(type==='textarea')return '<div class="field full"><label>'+label+'</label><textarea data-k="'+k+'">'+esc(val)+'</textarea></div>';return '<div class="field"><label>'+label+'</label><input data-k="'+k+'" type="'+(type==='number'?'number':type==='date'?'date':'text')+'" value="'+esc(val)+'" '+(type==='number'?'min="0"':'')+'></div>'}
function repeatField(k,label){let arr=data[k]||[];let html='<div class="field full"><label>'+label+'</label><div class="row-list">';arr.forEach((r,i)=>{if(k==='rooms')html+='<div class="repeat-row"><input type="number" min="1" placeholder="العدد" data-repeat="'+k+'" data-i="'+i+'" data-p="count" value="'+esc(r.count||1)+'"><input placeholder="نوع الغرفة" data-repeat="'+k+'" data-i="'+i+'" data-p="name" value="'+esc(r.name||'')+'"><button class="small-btn" data-remove="'+k+'" data-i="'+i+'">حذف</button></div>';else if(k==='legs')html+='<fieldset><legend>المقطع '+(i+1)+'</legend><div class="form-grid"><div class="field"><label>من</label><input data-repeat="legs" data-i="'+i+'" data-p="from" value="'+esc(r.from)+'"></div><div class="field"><label>إلى</label><input data-repeat="legs" data-i="'+i+'" data-p="to" value="'+esc(r.to)+'"></div><div class="field"><label>التاريخ</label><input type="date" data-repeat="legs" data-i="'+i+'" data-p="date" value="'+esc(r.date)+'"></div><div class="field"><label>الإقلاع</label><input data-repeat="legs" data-i="'+i+'" data-p="depart" value="'+esc(r.depart)+'"></div><div class="field"><label>الوصول</label><input data-repeat="legs" data-i="'+i+'" data-p="arrive" value="'+esc(r.arrive)+'"></div><div class="field"><label>شركة الطيران (اختياري)</label><input data-repeat="legs" data-i="'+i+'" data-p="airline" value="'+esc(r.airline)+'"></div></div><button class="small-btn" data-remove="legs" data-i="'+i+'">حذف المقطع</button></fieldset>';else html+='<div class="repeat-row"><textarea data-repeat="notes" data-i="'+i+'" data-p="text">'+esc(r)+'</textarea><button class="small-btn" data-remove="notes" data-i="'+i+'">حذف</button></div>'});html+='</div><button class="add" data-add="'+k+'">＋ '+(k==='rooms'?'إضافة غرفة':k==='legs'?'إضافة مقطع':'إضافة ملاحظة')+'</button></div>';return html}
function renderForm(){document.getElementById('formArea').innerHTML=types[current].fields.map(([k,l,t])=>field(k,l,t)).join('');document.querySelectorAll('[data-k]').forEach(el=>el.addEventListener('input',()=>{data[el.dataset.k]=el.value;updatePreview()}));document.querySelectorAll('[data-repeat]').forEach(el=>el.addEventListener('input',()=>{let a=data[el.dataset.repeat],i=+el.dataset.i,p=el.dataset.p;if(el.dataset.repeat==='notes')a[i]=el.value;else a[i][p]=el.type==='number'?Number(el.value):el.value;updatePreview()}));document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{let k=b.dataset.add;data[k].push(k==='rooms'?{count:1,name:''}:k==='legs'?{from:'',to:'',date:'',depart:'',arrive:'',airline:''}: '');renderForm();updatePreview()});document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{let k=b.dataset.remove;data[k].splice(+b.dataset.i,1);renderForm();updatePreview()})}
function val(k){return String(data[k]??'').trim()}
function price(){return val('price')?(val('price')+' '+val('currency')).trim():''}
function notesBlock(defaultsArr){let ns=(data.notes||[]).map(x=>String(x).trim()).filter(Boolean);if(!ns.length)ns=defaultsArr||[];return '📝 ملاحظة:\n'+ns.join('\n')}
function roomText(){let rs=(data.rooms||[]).filter(x=>x.name.trim());let label=rs.length>1?'🛏️ الغرف:':'🛏️ الغرفة:';return rs.map(x=>label+' '+(Number(x.count)>1?Number(x.count)+' × ':'')+x.name.trim()).join('\n')}
function legText(){return (data.legs||[]).map((l,i)=>{let parts=[];if(l.airline)parts.push(l.airline);parts.push((i===0?'✈️ الذهاب':'✈️ الرحلة '+(i+1))+': '+[l.from,l.to].filter(Boolean).join(' → '));if(l.date)parts.push('📅 '+l.date);if(l.depart||l.arrive)parts.push((l.depart||'')+' - '+(l.arrive||''));return parts.filter(Boolean).join('\n')}).filter(Boolean).join('\n\n')}
function build(){let out=[];let p=price();if(current==='hotel'){if(val('flag'))out.push(val('flag'));if(val('hotel'))out.push('🏨 الفندق: '+val('hotel'));if(roomText())out.push(roomText());if(val('in'))out.push('📅 الدخول: '+val('in'));if(val('out'))out.push('📅 الخروج: '+val('out'));if(val('meal'))out.push('🍽️ الوجبات: '+val('meal'));if(val('guests'))out.push('👥 عدد الأفراد: '+val('guests'));out.push('💰 السعر الإجمالي: '+p);out.push(notesBlock(defaults.notes))}
if(current==='flight'){if(val('airline'))out.push(val('airline'));if(val('trip'))out.push(val('trip'));if(legText())out.push(legText());let pax=[];['adults','children','infants'].forEach(k=>{if(val(k))pax.push(labels[k]+': '+val(k))});if(pax.length)out.push('👥 '+pax.join(' | '));if(val('baggage'))out.push('🧳 الحقائب: '+val('baggage'));out.push('💰 السعر الإجمالي: '+p);out.push('📝 ملاحظة:\n⏰ يُرجى التواجد في المطار قبل موعد الإقلاع بـ 3 ساعات على الأقل.\n✅ السعر شامل جميع الضرائب ما عدا ضريبة المدينة (إن وجدت).\n⚠️ السعر والإمكانية غير ثابتين حتى يتم تأكيد وإتمام الحجز.\n❌ الحجز غير مسترد وغير قابل للتعديل.')}
if(current==='combined'){if(val('airline'))out.push(val('airline'));if(legText())out.push(legText());out.push('========');if(val('hotel'))out.push('🏨 الفندق: '+val('hotel'));if(roomText())out.push(roomText());if(val('in'))out.push('📅 الدخول: '+val('in'));if(val('out'))out.push('📅 الخروج: '+val('out'));if(val('meal'))out.push('🍽️ الوجبات: '+val('meal'));if(val('guests'))out.push('👥 عدد الأفراد: '+val('guests'));out.push('💰 السعر الإجمالي: '+p);out.push('📝 ملاحظة:\n✅ السعر يشمل الطيران والفنادق.\n✅ السعر شامل جميع الضرائب ما عدا ضريبة المدينة (إن وجدت).\n⏰ يُرجى التواجد في المطار قبل موعد الإقلاع بـ 3 ساعات على الأقل.\n⚠️ السعر والإمكانية غير ثابتين حتى يتم تأكيد وإتمام الحجز.\n❌ الحجز غير مسترد وغير قابل للتعديل.')}
if(current==='cruise'){if(val('line'))out.push('الكروز: '+val('line'));if(val('ship'))out.push('🚢 السفينة: '+val('ship'));if(val('in')||val('out'))out.push('📅 '+val('in')+' - '+val('out'));if(val('nights'))out.push('🌙 عدد الليالي: '+val('nights'));if(val('cabin'))out.push('🛏️ الكبينة: '+val('cabin'));if(val('guests'))out.push('👥 عدد الأفراد: '+val('guests'));out.push('💰 السعر الإجمالي: '+p);out.push('📝 ملاحظة:\n✅ السعر شامل الضرائب ما عدا الإكراميات.\n⚠️ السعر والإمكانية غير ثابتين حتى يتم تأكيد وإتمام الحجز.\n❌ الحجز غير مسترد وغير قابل للتعديل.')}
if(current==='train'){if(val('operator'))out.push(val('operator'));if(legText())out.push(legText());if(val('guests'))out.push('👥 عدد الأفراد: '+val('guests'));if(val('baggage'))out.push('🧳 الحقائب: '+val('baggage'));out.push('💰 السعر الإجمالي: '+p)}
if(current==='transfer'){[['vehicle','🚘 السيارة'],['driver','السائق'],['date','📅 التاريخ'],['route','📍 خط السير'],['guests','👥 عدد الأفراد'],['luggage','🧳 الحقائب'],['duration','⏱️ المدة']].forEach(([k,l])=>{if(val(k))out.push(l+': '+val(k))});out.push('💰 السعر: '+p)}
if(current==='ticket'){[['event','🎟️ الفعالية'],['date','📅 التاريخ'],['time','🕒 الوقت'],['venue','📍 المكان'],['category','🎫 الفئة'],['quantity','🔢 العدد']].forEach(([k,l])=>{if(val(k))out.push(l+': '+val(k))});out.push('💰 السعر الإجمالي: '+p);out.push('📝 ملاحظة:\n⚠️ السعر والإمكانية غير ثابتين حتى يتم تأكيد وإتمام الحجز.\n❌ الحجز غير مسترد وغير قابل للتعديل.')}
if(current==='package'){[['destination','🌍 الوجهة'],['in','📅 تاريخ البداية'],['out','📅 تاريخ النهاية'],['guests','👥 عدد الأفراد'],['meal','🍽️ الوجبات'],['details','🗺️ البرنامج'],['included','✅ يشمل'],['excluded','❌ لا يشمل']].forEach(([k,l])=>{if(val(k))out.push(l+': '+val(k))});out.push('💰 السعر الإجمالي: '+p);out.push(notesBlock([]))}
return out.join('\n\n').trim()}
function updatePreview(){document.getElementById('offer').textContent=build()}
function toast(s){let t=document.getElementById('toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)}
function switchType(t){if(t==='saved'){document.getElementById('work').classList.add('hidden');document.getElementById('savedPage').classList.remove('hidden');document.getElementById('pageTitle').textContent='العروض المحفوظة';document.getElementById('pageDesc').textContent='افتح أو احذف العروض المحفوظة على هذا الجهاز.';renderSaved();return}if(current)drafts[current]=data;current=t;data=drafts[t]||fresh(t);document.getElementById('work').classList.remove('hidden');document.getElementById('savedPage').classList.add('hidden');document.getElementById('pageTitle').textContent=types[t].title;document.getElementById('pageDesc').textContent=types[t].desc;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.type===t));renderForm();updatePreview()}
document.getElementById('nav').addEventListener('click',e=>{let b=e.target.closest('button[data-type]');if(b)switchType(b.dataset.type)});
document.getElementById('newBtn').onclick=()=>{data=fresh(current);drafts[current]=data;renderForm();updatePreview()};
document.getElementById('copyBtn').onclick=async()=>{let text=build(),ok=false;try{if(navigator.clipboard&&isSecureContext){await navigator.clipboard.writeText(text);ok=true}}catch{}if(!ok){let ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.left='-9999px';document.body.appendChild(ta);ta.focus();ta.select();try{ok=document.execCommand('copy')}catch{}ta.remove()}toast(ok?'تم نسخ العرض بنجاح':'تعذر النسخ؛ حاول مرة أخرى')};
document.getElementById('printBtn').onclick=()=>window.print();
document.getElementById('saveBtn').onclick=()=>{let title=val('hotel')||val('event')||val('destination')||val('ship')||val('airline')||types[current].title; saved.unshift({id:Date.now(),type:current,title,text:build(),data:JSON.parse(JSON.stringify(data)),date:new Date().toLocaleDateString('ar')});localStorage.setItem('travelOffersSaved',JSON.stringify(saved));toast('تم حفظ العرض على هذا الجهاز')};
function renderSaved(){let root=document.getElementById('savedList');root.innerHTML=saved.length?saved.map(s=>'<div class="saved-item"><div><strong>'+esc(s.title)+'</strong><small>'+esc(types[s.type]?.title||'عرض')+' · '+esc(s.date||'')+'</small></div><div><button data-open="'+s.id+'">فتح</button><button data-del="'+s.id+'">حذف</button></div></div>').join(''):'<p class="empty">لا توجد عروض محفوظة حتى الآن.</p>';root.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{let s=saved.find(x=>x.id==b.dataset.open);switchType(s.type);data=s.data;drafts[current]=data;renderForm();updatePreview()});root.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{saved=saved.filter(x=>x.id!=b.dataset.del);localStorage.setItem('travelOffersSaved',JSON.stringify(saved));renderSaved()})}
document.getElementById('clearSaved').onclick=()=>{if(confirm('هل تريد مسح جميع العروض المحفوظة؟')){saved=[];localStorage.removeItem('travelOffersSaved');renderSaved()}};
switchType('hotel');
</script></body></html>
